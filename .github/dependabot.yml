---
# Dependabot version updates: opens a pull request when a pinned version in
# this repository has a newer release. Each pull request still has to pass the pre-commit workflow before merging.
version: 2

updates:
  # Actions pinned by commit hash in .github/workflows/
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]

  # Hook revisions pinned in .pre-commit-config.yaml
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
    groups:
      pre-commit-hooks:
        patterns: ["*"]
...
